services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jasna}
      POSTGRES_USER: ${POSTGRES_USER:-jasna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jasna_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-jasna}
      DB_USER: ${POSTGRES_USER:-jasna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jasna_local}
      DB_SSLMODE: disable
      MASTER_LOGIN: ${MASTER_LOGIN:-master}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-}
      PAYMENT_TEST: "true"
      PAYMENT_STUB: ${PAYMENT_STUB:-false}
      RECEIPT_ALLOWED_HOSTS: ${RECEIPT_ALLOWED_HOSTS:-lknpd.nalog.ru}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
